name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'package.json'
      - 'electron/**'
      - 'server/**'
      - 'public/**'
      - 'assets/**'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install
      - name: Gerar ícone ICO válido a partir do PNG da clínica
        shell: pwsh
        run: |
          npm install --no-save png-to-ico
          node --input-type=module -e "import fs from 'node:fs'; const mod = await import('png-to-ico'); const pngToIco = mod.default ?? mod.pngToIco ?? mod; if (typeof pngToIco !== 'function') throw new TypeError('Exportação de png-to-ico não é uma função: ' + Object.keys(mod).join(', ')); const buf = await pngToIco('assets/hospital-dos-reis-premium.png'); fs.writeFileSync('assets/hospital-dos-reis-premium.ico', buf); console.log('Ícone ICO gerado com sucesso.');"
      - name: Compilar instalador Windows
        run: npm run dist
      - name: Publicar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Hospital-dos-Reis-Premium-Estoque-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
