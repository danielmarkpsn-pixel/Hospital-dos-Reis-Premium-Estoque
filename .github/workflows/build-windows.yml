name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'package.json'
      - 'electron/**'
      - 'server/**'
      - 'public/**'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install
      - name: Compilar instalador Windows
        run: npm run dist
      - name: Publicar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Hospital-dos-Reis-Premium-Estoque-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
